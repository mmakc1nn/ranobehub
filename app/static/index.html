<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Читалка вслух</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <h1>Читалка вслух</h1>
    <p class="hint">Вставь текст, выбери голос и нажми «Прочитать». Озвучка идёт через Silero TTS.</p>

    <textarea id="text" placeholder="Вставь сюда текст главы или отрывок..."></textarea>

    <div class="controls">
      <label>
        Язык
        <select id="language"></select>
      </label>

      <label>
        Голос
        <select id="speaker"></select>
      </label>

      <label>
        Скорость
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
        <span id="rateValue">1.0×</span>
      </label>

      <button id="speak">Прочитать</button>
      <a id="download" class="download hidden" download="reading.wav">Скачать WAV</a>
    </div>

    <div id="status" class="status"></div>

    <audio id="player" controls class="hidden"></audio>
  </main>

  <script src="/app.js"></script>
</body>
</html>
